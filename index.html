<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --blue:#0b4a8f; --blue-soft:#dce8f7; --ink:#16233b; --muted:#5b6780; --line:#d5dce8;
            --bg:#eef3f9; --ok:#127a3e; --err:#b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }

    /* Blue header: logo + title (same as the appointment form) */
    .band { position: sticky; top: 0; z-index: 30; background: var(--blue); color: #fff;
            padding: 10px 16px; box-shadow: 0 2px 10px rgba(8, 40, 80, .25); }
    .band-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 14px; }
    .brand { display: flex; flex: none; }
    .brand .logo { width: 0.9in; height: 0.6in; background: #fff; border-radius: 8px;
                   padding: 4px; display: flex; align-items: center; justify-content: center; }
    .brand img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    h1 { font: 600 24px/1.2 Georgia, "Times New Roman", serif; margin: 0; }

    main { max-width: 560px; margin: 24px auto 40px; padding: 0 16px; }
    form { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 24px;
           box-shadow: 0 8px 24px rgba(11, 74, 143, .08); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .full { grid-column: 1 / -1; }
    label, .label { display: block; font-size: 13px; color: #44506a; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 8px; font: inherit; color: inherit; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue-soft); border-color: var(--blue); }
    option:disabled { color: #a0a8b8; background: #eef0f4; }
    .req-note { font-size: 13px; color: #5b6780; margin: 0 0 16px; }
    .req-note b { color: #b42318; }
    .req::after { content: " *"; color: #b42318; font-weight: 600; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 1.2em; }
    .hint.err { color: var(--err); }
    .busy { font-size: 12.5px; color: #8a5a00; background: #fff7e6; border: 1px solid #f5dfb3; border-radius: 8px; padding: 7px 10px; }

    /* Date + time fields with pop-up calendar (same as the appointment form) */
    .dt-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 12px; }
    .datebox, .timebox { position: relative; }
    .field-btn { width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
      font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
    .field-btn[aria-expanded="true"], .field-btn:focus { outline: 2px solid var(--blue-soft); border-color: var(--blue); }
    .field-btn .ph { color: #8a93a6; }
    .ico { width: 20px; height: 20px; flex: none; color: #44506a; }
    .timebox select { appearance: none; -webkit-appearance: none; padding-right: 40px; cursor: pointer; }
    .timebox .ico { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .sublbl { font-size: 11.5px; color: var(--muted); margin: 0 0 4px 2px; }
    .pop { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; width: 300px; max-width: 86vw;
           background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px;
           box-shadow: 0 10px 28px rgba(22, 35, 59, .18); }
    .pop[hidden] { display: none; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 10px 6px; }
    .cal-title { font-weight: 600; }
    .cal-nav { width: 32px; height: 32px; border: 0; background: transparent; border-radius: 50%;
               color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer; }
    .cal-nav:hover:not(:disabled) { background: #eef2f8; }
    .cal-nav:disabled { opacity: .3; cursor: default; }
    .wk, .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
    .wk span { font-size: 12px; color: var(--muted); padding: 4px 0 8px; }
    .days button { width: 36px; height: 36px; margin: 1px auto; border: 0; border-radius: 50%;
                   background: transparent; color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
    .days button:hover:not(:disabled) { background: var(--blue-soft); }
    .days button:disabled { color: #c3c9d4; cursor: default; }
    .days button.today { box-shadow: inset 0 0 0 1.5px var(--blue); }
    .days button.sel { background: var(--blue); color: #fff; font-weight: 600; box-shadow: none; }

    /* Tick-box groups (IT / refreshments) */
    fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; margin: 0; }
    legend { font-size: 13px; color: #44506a; padding: 0 6px; }
    legend small { color: var(--muted); }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .check { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink); margin: 0; cursor: pointer; }
    .check input { width: 17px; height: 17px; margin: 0; accent-color: var(--blue); flex: none; }
    .checks + input { margin-top: 10px; }

    #send { margin-top: 22px; width: 100%; padding: 13px; border: 0; border-radius: 8px;
            background: var(--blue); color: #fff; font: 600 15px/1 inherit; cursor: pointer; }
    #send:hover { background: #083a70; }
    #send:disabled { opacity: .6; cursor: default; }
    button:focus-visible { outline: 3px solid #7fa7d9; outline-offset: 2px; }
    #msg { text-align: center; margin: 14px 0 0; min-height: 1.4em; }
    #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
    [hidden] { display: none !important; }
    @media (max-width: 560px) { .grid, .dt-row, .checks { grid-template-columns: 1fr; } h1 { font-size: 18px; }
                                .brand .logo { width: 0.75in; height: 0.5in; } }
  </style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <div class="brand">
      <span class="logo"><img src="logo.png" alt="Kuwait Hospital logo"></span>
    </div>
    <h1>Book a Meeting Room</h1>
  </div>
</header>

<main>
  <form id="f" novalidate>
    <p class="req-note">Fields marked <b>*</b> are required. Please use your hospital email address.</p>
    <div class="grid">
      <div><label for="name" class="req">Your name</label>
        <input id="name" name="name" required maxlength="100" autocomplete="name"></div>
      <div><label for="dept" class="req">Department</label>
        <input id="dept" name="dept" required maxlength="100"></div>
      <div><label for="email" class="req">Hospital email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="name@kuwaithospital.com.kw"></div>
      <div><label for="mobile">Mobile / extension</label>
        <input id="mobile" name="mobile" type="tel" maxlength="15" autocomplete="tel"></div>

      <div class="full"><label for="room" class="req">Room</label>
        <select id="room" name="room" required><option value="">Loading rooms…</option></select>
        <div class="hint" id="roomHint"></div></div>
      <div><label for="title" class="req">Meeting title</label>
        <input id="title" name="title" required maxlength="150"></div>
      <div><label for="attendees" class="req">Number of attendees</label>
        <input id="attendees" name="attendees" type="number" min="1" max="500" required></div>

      <div class="full">
        <span class="label req" id="dtLabel">Date / Time</span>
        <div class="dt-row">
          <div class="datebox">
            <div class="sublbl">Date</div>
            <button type="button" class="field-btn" id="dateBtn" aria-haspopup="dialog" aria-expanded="false"
                    aria-labelledby="dtLabel dateText"><span id="dateText" class="ph">dd/mm/yyyy</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
            <div class="pop" id="pop" role="dialog" aria-label="Choose date" hidden>
              <div class="cal-head">
                <span class="cal-title" id="calTitle"></span>
                <span>
                  <button type="button" class="cal-nav" id="prev" aria-label="Previous month">&#8249;</button>
                  <button type="button" class="cal-nav" id="next" aria-label="Next month">&#8250;</button>
                </span>
              </div>
              <div class="wk"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
              <div class="days" id="days"></div>
            </div>
          </div>
          <div class="timebox"><div class="sublbl">Start</div>
            <select id="start" name="start" required aria-label="Start time"><option value="">Choose room and date</option></select><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
          <div class="timebox"><div class="sublbl">End</div>
            <select id="end" name="end" required disabled aria-label="End time"><option value="">Choose start first</option></select><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        </div>
        <input type="hidden" id="date" name="date">
      </div>
      <div class="full" id="busyBox" hidden><div class="busy" id="busy"></div></div>

      <div class="full">
        <fieldset>
          <legend>IT requirements <small>– sent to IT Support when approved</small></legend>
          <div class="checks">
            <label class="check"><input type="checkbox" name="it" value="Laptop"> Laptop</label>
            <label class="check"><input type="checkbox" name="it" value="Projector / screen"> Projector / screen</label>
            <label class="check"><input type="checkbox" name="it" value="Video conference"> Video conference</label>
            <label class="check"><input type="checkbox" name="it" value="Microphone / speakers"> Microphone / speakers</label>
            <label class="check"><input type="checkbox" name="it" value="Whiteboard"> Whiteboard</label>
            <label class="check"><input type="checkbox" name="it" value="Printer / clicker"> Printer / clicker</label>
          </div>
        </fieldset>
      </div>
      <div class="full">
        <fieldset>
          <legend>Refreshments <small>– sent to Hospitality when approved</small></legend>
          <div class="checks">
            <label class="check"><input type="checkbox" name="food" value="Water"> Water</label>
            <label class="check"><input type="checkbox" name="food" value="Tea / Coffee"> Tea / Coffee</label>
            <label class="check"><input type="checkbox" name="food" value="Juice"> Juice</label>
            <label class="check"><input type="checkbox" name="food" value="Snacks"> Snacks</label>
          </div>
          <input id="foodNote" maxlength="200" placeholder="Other refreshment details (optional), e.g. dates, sandwiches for 10" aria-label="Other refreshment details">
        </fieldset>
      </div>

      <div class="full"><label class="check"><input type="checkbox" id="priv"> Private meeting – the room screen shows “Private meeting” instead of the title and your name</label></div>
      <div class="full"><label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3" maxlength="1000"></textarea></div>
    </div>
    <button id="send" type="submit">Send booking request</button>
    <p id="msg" role="status"></p>
  </form>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const f = $('f'), room = $('room'), date = $('date'), start = $('start'), end = $('end'), msg = $('msg'), send = $('send');
  const clean = e => String((e && e.message) || e).replace(/^(Error|Exception):\s*/, '');
  const say = (t, c) => { msg.textContent = t; msg.className = c || ''; };
  const pad = n => String(n).padStart(2, '0');
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const toHM = n => pad(Math.floor(n / 60)) + ':' + pad(n % 60);
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const dmy = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let CFG = { start: '07:00', end: '17:00', step: 30, maxHours: 8, days: [0, 1, 2, 3, 4], ahead: 60, domain: 'kuwaithospital.com.kw' };
  let ROOMS = [], BUSY = [];

  /* ---- calendar ---- */
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  const maxDay = () => { const d = new Date(today); d.setDate(d.getDate() + CFG.ahead); return d; };
  function renderCal() {
    const y = view.getFullYear(), m = view.getMonth();
    $('calTitle').textContent = MONTHS[m] + ' ' + y;
    $('prev').disabled = y === today.getFullYear() && m === today.getMonth();
    $('next').disabled = new Date(y, m + 1, 1) > maxDay();
    const box = $('days'); box.innerHTML = '';
    for (let i = 0; i < new Date(y, m, 1).getDay(); i++) box.appendChild(document.createElement('span'));
    for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
      const dt = new Date(y, m, d), iso = ymd(dt), b = document.createElement('button');
      b.type = 'button'; b.textContent = d; b.setAttribute('aria-label', DAYS[dt.getDay()] + ' ' + dmy(dt));
      b.disabled = dt < today || dt > maxDay() || !CFG.days.includes(dt.getDay());
      if (+dt === +today) b.classList.add('today');
      if (iso === date.value) b.classList.add('sel');
      b.addEventListener('click', () => { date.value = iso; $('dateText').textContent = dmy(dt) + '  (' + DAYS[dt.getDay()] + ')'; $('dateText').className = '';
                                          closeCal(); renderCal(); loadBusy(); });
      box.appendChild(b);
    }
  }
  const pop = $('pop'), dateBtn = $('dateBtn');
  function openCal() { pop.hidden = false; dateBtn.setAttribute('aria-expanded', 'true'); (pop.querySelector('.days button:not(:disabled)') || $('next')).focus(); }
  function closeCal() { pop.hidden = true; dateBtn.setAttribute('aria-expanded', 'false'); }
  dateBtn.addEventListener('click', () => pop.hidden ? openCal() : closeCal());
  document.addEventListener('click', e => { if (!pop.hidden && !e.target.closest('.datebox')) closeCal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !pop.hidden) { closeCal(); dateBtn.focus(); } });
  $('prev').addEventListener('click', () => { view.setMonth(view.getMonth() - 1); renderCal(); });
  $('next').addEventListener('click', () => { view.setMonth(view.getMonth() + 1); renderCal(); });

  /* ---- times ---- */
  const overlaps = (a, b) => BUSY.some(x => a < toMin(x.end) && b > toMin(x.start));
  function fillStart() {
    const keep = start.value; start.innerHTML = '';
    if (!room.value || !date.value) { start.add(new Option('Choose room and date', '')); fillEnd(); return; }
    start.add(new Option('Select start', ''));
    const nowMin = date.value === ymd(new Date()) ? new Date().getHours() * 60 + new Date().getMinutes() : -1;
    for (let t = toMin(CFG.start); t + CFG.step <= toMin(CFG.end); t += CFG.step) {
      const o = new Option(toHM(t), toHM(t)); o.disabled = t <= nowMin || overlaps(t, t + CFG.step); start.add(o);
    }
    if (keep && [...start.options].some(o => o.value === keep && !o.disabled)) start.value = keep;
    fillEnd();
  }
  function fillEnd() {
    const keep = end.value; end.innerHTML = '';
    if (!start.value) { end.add(new Option('Choose start first', '')); end.disabled = true; return; }
    end.disabled = false; end.add(new Option('Select end', ''));
    const s = toMin(start.value), limit = Math.min(toMin(CFG.end), s + CFG.maxHours * 60);
    for (let t = s + CFG.step; t <= limit; t += CFG.step) {
      if (overlaps(s, t)) break;
      const mins = t - s;
      end.add(new Option(toHM(t) + '  (' + (mins >= 60 ? Math.floor(mins / 60) + ' h' + (mins % 60 ? ' 30 min' : '') : mins + ' min') + ')', toHM(t)));
    }
    if (keep && [...end.options].some(o => o.value === keep)) end.value = keep;
  }
  let ticket = 0;
  function loadBusy() {
    BUSY = []; $('busyBox').hidden = true; fillStart();
    if (!room.value || !date.value) return;
    const my = ++ticket;
    google.script.run.withSuccessHandler(b => {
      if (my !== ticket) return; BUSY = b; fillStart();
      if (b.length) { $('busy').textContent = 'Already booked that day: ' + b.map(x => x.start + '–' + x.end).join(', '); $('busyBox').hidden = false; }
    }).withFailureHandler(e => { if (my === ticket) say(clean(e), 'err'); }).getBusy(room.value, date.value);
  }
  room.addEventListener('change', () => {
    const r = ROOMS.find(x => x.name === room.value);
    $('roomHint').textContent = r ? [r.capacity ? 'Up to ' + r.capacity + ' people' : '', r.location, r.approval ? 'needs approval' : 'confirmed instantly'].filter(Boolean).join(' · ') : '';
    loadBusy();
  });
  start.addEventListener('change', fillEnd);

  /* ---- start-up ---- */
  google.script.run.withSuccessHandler(c => { CFG = c; renderCal(); }).getHours();
  google.script.run.withSuccessHandler(list => {
    ROOMS = list; room.innerHTML = ''; room.add(new Option('Select room', ''));
    list.forEach(r => room.add(new Option(r.name + (r.capacity ? '  (up to ' + r.capacity + ')' : ''), r.name)));
  }).withFailureHandler(() => { room.options[0].text = 'Could not load rooms – please refresh'; }).getRooms();
  renderCal();

  /* ---- submit ---- */
  f.addEventListener('submit', e => {
    e.preventDefault(); say('');
    for (const id of ['name', 'dept', 'email', 'room', 'title', 'attendees']) if (!$(id).value.trim()) { say('Please fill in all required fields.', 'err'); $(id).focus(); return; }
    if (CFG.domain && !$('email').value.trim().toLowerCase().endsWith('@' + CFG.domain)) { say('Please use your hospital email (@' + CFG.domain + ').', 'err'); $('email').focus(); return; }
    if (!date.value) { say('Choose a date.', 'err'); openCal(); return; }
    if (!start.value || !end.value) { say('Choose a start and end time.', 'err'); return; }
    const data = { name: $('name').value, dept: $('dept').value, email: $('email').value, mobile: $('mobile').value, room: room.value,
      title: $('title').value, attendees: $('attendees').value, date: date.value, start: start.value, end: end.value,
      needs: [...document.querySelectorAll('input[name=it]:checked')].map(x => x.value).join(', '),
      refresh: [[...document.querySelectorAll('input[name=food]:checked')].map(x => x.value).join(', '), $('foodNote').value.trim()].filter(Boolean).join(' – '),
      priv: $('priv').checked, notes: $('notes').value };
    send.disabled = true; send.textContent = 'Sending…';
    google.script.run.withSuccessHandler(r => {
      say((r.status === 'Approved' ? 'Booked! ' : 'Request sent for approval. ') + r.room + ', ' + r.when + ' – reference ' + r.id + '. Check your email.', 'ok');
      f.reset(); date.value = ''; $('dateText').textContent = 'dd/mm/yyyy'; $('dateText').className = 'ph'; $('roomHint').textContent = '';
      BUSY = []; $('busyBox').hidden = true; renderCal(); fillStart();
      send.disabled = false; send.textContent = 'Send booking request';
    }).withFailureHandler(err => { say(clean(err), 'err'); loadBusy(); send.disabled = false; send.textContent = 'Send booking request'; })
      .submitBooking(data);
  });
</script>
</body>
</html>
