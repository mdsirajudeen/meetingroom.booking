<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="60">
  <title>Room Status – Kuwait Hospital</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --blue:#0D2D6B; --blue-mid:#1A3A7A;
      --green:#166534; --green-bg:#dcfce7; --green-border:#86efac;
      --red:#b91c1c;   --red-bg:#fee2e2;   --red-border:#fca5a5;
      --amber:#92400e; --amber-bg:#fef3c7; --amber-border:#fde68a;
      --ink:#16233b; --sub:#44506a; --muted:#6b7896; --line:#c8d8ee;
      --bg:#e8eef7; --card:#ffffff; --field:#EBF2FB;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--bg); color:var(--ink);
      font-family:'Inter',system-ui,sans-serif;
      display:flex; flex-direction:column; min-height:100vh;
    }

    /* Header */
    .band {
      background:var(--blue); padding:14px 28px;
      display:flex; align-items:center; gap:16px;
      box-shadow:0 2px 16px rgba(8,40,80,.35); flex-shrink:0;
    }
    .logo-box {
      height:52px; background:#fff; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      padding:5px 10px; flex-shrink:0;
    }
    .logo-box img { height:40px; width:auto; }
    .band-title { flex:1; }
    .band-title h1 { color:#fff; font-size:20px; font-weight:700; }
    .band-title p  { color:rgba(255,255,255,.65); font-size:13px; margin-top:2px; }
    .live-clock { text-align:right; flex-shrink:0; }
    .clk-time { font-size:26px; font-weight:800; color:#fff; letter-spacing:.06em; }
    .clk-date { font-size:12px; color:rgba(255,255,255,.7); margin-top:2px; }

    /* Main */
    main { flex:1; display:flex; flex-direction:column; padding:16px; }

    /* Room card */
    .room-card {
      background:var(--card); border-radius:16px;
      border:3px solid var(--line);
      box-shadow:0 4px 24px rgba(11,74,143,.08);
      display:flex; flex-direction:column; flex:1;
      overflow:hidden; transition:border-color .3s;
    }
    .room-card.available { border-color:var(--green-border); }
    .room-card.occupied  { border-color:var(--red-border); }

    .status-bar {
      padding:18px 24px; display:flex; align-items:center; gap:14px; flex-shrink:0;
    }
    .room-card.available .status-bar { background:var(--green-bg); }
    .room-card.occupied  .status-bar { background:var(--red-bg); }
    .room-card.loading   .status-bar { background:var(--field); }

    .status-dot { width:20px; height:20px; border-radius:50%; flex-shrink:0; }
    .room-card.available .status-dot { background:var(--green); animation:pulse-green 2s ease infinite; }
    .room-card.occupied  .status-dot { background:var(--red); animation:pulse-red 1.5s ease infinite; }
    .room-card.loading   .status-dot { background:var(--muted); }

    @keyframes pulse-green {
      0%,100% { box-shadow:0 0 0 0 rgba(22,101,52,.4); }
      50%      { box-shadow:0 0 0 10px rgba(22,101,52,0); }
    }
    @keyframes pulse-red {
      0%,100% { box-shadow:0 0 0 0 rgba(185,28,28,.4); }
      50%      { box-shadow:0 0 0 10px rgba(185,28,28,0); }
    }

    .status-label { font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
    .room-card.available .status-label { color:var(--green); }
    .room-card.occupied  .status-label { color:var(--red); }
    .room-card.loading   .status-label { color:var(--muted); }

    .status-until { margin-left:auto; font-size:15px; font-weight:600; }
    .room-card.available .status-until { color:var(--green); }
    .room-card.occupied  .status-until { color:var(--red); }

    .room-name-row {
      padding:18px 24px 12px; border-bottom:1px solid var(--line); flex-shrink:0;
    }
    .room-name { font-size:32px; font-weight:800; color:var(--blue); line-height:1.15; }
    .room-loc  { font-size:15px; color:var(--muted); margin-top:6px; }

    .current-section { padding:20px 24px; flex:1; display:flex; flex-direction:column; gap:16px; }

    .meet-label { font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); }
    .meet-title { font-size:24px; font-weight:700; color:var(--ink); line-height:1.3; margin-top:6px; }
    .meet-title.private { color:var(--muted); font-style:italic; font-weight:500; font-size:20px; }

    .meet-meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
    .chip {
      display:inline-flex; align-items:center; gap:6px;
      background:var(--field); border:1px solid var(--line);
      border-radius:20px; padding:6px 14px; font-size:13px; color:var(--sub); font-weight:500;
    }

    .time-row {
      display:flex; align-items:center; gap:12px;
      background:var(--field); border-radius:12px; padding:14px 18px;
    }
    .time-block { text-align:center; flex:1; }
    .time-lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
    .time-val { font-size:22px; font-weight:800; color:var(--blue); margin-top:2px; }
    .time-arrow { font-size:22px; color:var(--muted); }

    .progress-bg { background:var(--field); border-radius:99px; height:8px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,#dc2626,#ef4444); transition:width .5s ease; }
    .progress-info { display:flex; justify-content:space-between; margin-top:6px; font-size:12px; color:var(--muted); }

    .next-box { background:var(--amber-bg); border:1px solid var(--amber-border); border-radius:12px; padding:14px 18px; }
    .next-label { font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--amber); }
    .next-title { font-size:16px; font-weight:600; color:var(--ink); margin-top:4px; }
    .next-time  { font-size:14px; color:var(--amber); margin-top:3px; }

    .avail-section {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:24px; text-align:center; gap:14px;
    }
    .avail-icon { font-size:80px; line-height:1; }
    .avail-text { font-size:28px; font-weight:700; color:var(--green); }
    .avail-sub  { font-size:16px; color:var(--muted); }

    .loading-wrap { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:20px; }
    .spin { width:40px; height:40px; border:4px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error-msg { font-size:14px; color:var(--red); text-align:center; }

    footer { background:var(--blue); color:rgba(255,255,255,.55); font-size:11px; text-align:center; padding:9px; flex-shrink:0; }
  </style>
</head>
<body>

<header class="band">
  <div class="logo-box"><img src="logo.png" alt="Kuwait Hospital" onerror="this.style.display='none'"></div>
  <div class="band-title">
    <h1 id="headerTitle">Room Status</h1>
    <p>Kuwait Hospital – Live Room Availability</p>
  </div>
  <div class="live-clock">
    <div class="clk-time" id="clkTime">00:00:00</div>
    <div class="clk-date" id="clkDate"></div>
  </div>
</header>

<main>
  <div class="room-card loading" id="roomCard">
    <div class="status-bar">
      <div class="status-dot"></div>
      <div class="status-label" id="statusLabel">Loading…</div>
    </div>
    <div class="room-name-row">
      <div class="room-name" id="roomNameDisp">–</div>
      <div class="room-loc" id="roomLocDisp"></div>
    </div>
    <div class="loading-wrap" id="cardBody">
      <div class="spin"></div>
      <div style="color:var(--muted);font-size:14px">Fetching room status…</div>
    </div>
  </div>
</main>

<footer>
  Kuwait Hospital &nbsp;·&nbsp; Meeting Room Booking System &nbsp;·&nbsp; Auto-refreshes every 60 seconds
</footer>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwM9MzgGc_8xWvrqgB80MDjIGNCyrbj15OHZBYXPY1bEpLURpBDZOrqdfV-j-RESyBg/exec';

// Map URL room name → location (covers both old and new naming)
var ROOM_LOC = {
  'Executive Hall':        'Floor 10',
  'Executive Room':        'Floor 10',
  'Basement Meeting Hall': 'Basement Floor',
  'Basement Meeting Room': 'Basement Floor',
  'Meeting Hall 1015':     'Floor 10',
  'Hall 1015':             'Floor 10',
  
  'KHC Meeting Hall':      'Floor 1'
};

// Map URL room name → GAS room name (if different)
// The URL param room name might differ from what's in the Sheet
var ROOM_MAP = {
  'Executive Room':        'Executive Room',
  'Basement Meeting Room': 'Basement Meeting Room',
  'Hall 1015':             'Hall 1015',
  'Executive Hall':        'Executive Hall',
  'Basement Meeting Hall': 'Basement Meeting Hall',
  'Meeting Hall 1015':     'Meeting Hall 1015',
  'KHC Meeting Hall':      'KHC Meeting Hall'
};

var urlParams = new URLSearchParams(window.location.search);
var displayName = urlParams.get('room') || 'Unknown Room';
var gasRoomName = ROOM_MAP[displayName] || displayName;
var roomLoc     = ROOM_LOC[displayName] || '';

document.getElementById('headerTitle').textContent   = displayName;
document.getElementById('roomNameDisp').textContent  = displayName;
document.getElementById('roomLocDisp').textContent   = roomLoc ? '📍 ' + roomLoc : '';

// Live clock
var DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function tick() {
  var n = new Date();
  document.getElementById('clkTime').textContent =
    pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
  document.getElementById('clkDate').textContent =
    DAYS[n.getDay()] + ', ' + n.getDate() + ' ' + MONTHS[n.getMonth()] + ' ' + n.getFullYear();
}
tick(); setInterval(tick, 1000);
function pad(n){ return String(n).padStart(2,'0'); }

function callGas(fn, args, ok, fail) {
  fetch(GAS_URL, { method:'POST', body: JSON.stringify({ fn:fn, args:args }) })
    .then(function(r){ return r.json(); })
    .then(function(d){ d.ok ? ok(d.data) : fail(d.error || 'Server error'); })
    .catch(function(e){ fail(e.message || 'Network error'); });
}

function renderStatus(data) {
  var card  = document.getElementById('roomCard');
  var label = document.getElementById('statusLabel');
  var body  = document.getElementById('cardBody');
  var now   = data.now || Date.now();
  var html  = '';

  var meetings = (data.meetings || []).filter(function(m){ return m.endMs > now; });
  var current  = null;
  meetings.forEach(function(m){ if (m.startMs <= now && m.endMs > now) current = m; });
  var upcoming = meetings.filter(function(m){ return m.startMs > now; });
  upcoming.sort(function(a,b){ return a.startMs - b.startMs; });
  var next = upcoming[0] || null;

  // Remove old status-until chip
  var oldUtil = card.querySelector('.status-until');
  if (oldUtil) oldUtil.remove();

  function addUntil(txt) {
    var u = document.createElement('div');
    u.className = 'status-until';
    u.textContent = txt;
    card.querySelector('.status-bar').appendChild(u);
  }

  if (current) {
    card.className = 'room-card occupied';
    label.textContent = '🔴 In Use';

    var elapsed  = now - current.startMs;
    var duration = current.endMs - current.startMs;
    var pct      = Math.min(100, Math.round(elapsed / duration * 100));
    var minsLeft = Math.ceil((current.endMs - now) / 60000);
    addUntil(minsLeft <= 60 ? 'Ends in ' + minsLeft + ' min' : 'Until ' + current.end);

    html = '<div class="current-section"><div>' +
           '<div class="meet-label">Current Meeting</div>' +
           '<div class="meet-title' + (current.priv ? ' private' : '') + '">' +
           (current.priv ? '🔒 Private Meeting' : (current.title || 'Meeting')) + '</div>';
    if (!current.priv) {
      html += '<div class="meet-meta">';
      if (current.host) html += '<span class="chip">👤 ' + current.host + '</span>';
      if (current.dept) html += '<span class="chip">🏥 ' + current.dept + '</span>';
      html += '</div>';
    }
    html += '</div>' +
            '<div class="time-row">' +
              '<div class="time-block"><div class="time-lbl">Started</div><div class="time-val">' + current.start + '</div></div>' +
              '<div class="time-arrow">→</div>' +
              '<div class="time-block"><div class="time-lbl">Ends</div><div class="time-val">' + current.end + '</div></div>' +
            '</div>' +
            '<div>' +
              '<div class="progress-bg"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
              '<div class="progress-info"><span>' + pct + '% elapsed</span><span>' + minsLeft + ' min remaining</span></div>' +
            '</div>';
    if (next) {
      html += '<div class="next-box">' +
              '<div class="next-label">⏭ Next Meeting</div>' +
              '<div class="next-title">' + (next.priv ? '🔒 Private' : (next.title || 'Meeting')) + '</div>' +
              '<div class="next-time">🕐 ' + next.start + ' – ' + next.end + '</div>' +
              '</div>';
    }
    html += '</div>';

  } else if (next) {
    card.className = 'room-card available';
    label.textContent = '🟢 Available';
    var minsToNext = Math.ceil((next.startMs - now) / 60000);
    var freeStr = minsToNext <= 60 ? 'Free for ' + minsToNext + ' min' : 'Free until ' + next.start;
    addUntil(freeStr);

    html = '<div class="avail-section">' +
           '<div class="avail-icon">✅</div>' +
           '<div class="avail-text">Room is Available</div>' +
           '<div class="avail-sub">' + freeStr + '</div>' +
           '</div>' +
           '<div style="padding:0 24px 20px">' +
           '<div class="next-box">' +
           '<div class="next-label">⏭ Next Meeting</div>' +
           '<div class="next-title">' + (next.priv ? '🔒 Private' : (next.title || 'Meeting')) + '</div>' +
           '<div class="next-time">🕐 ' + next.start + ' – ' + next.end + '</div>' +
           '</div></div>';

  } else {
    card.className = 'room-card available';
    label.textContent = '🟢 Available';
    addUntil('All day');

    html = '<div class="avail-section">' +
           '<div class="avail-icon">✅</div>' +
           '<div class="avail-text">Room is Available</div>' +
           '<div class="avail-sub">No meetings scheduled for the rest of today</div>' +
           '</div>';
  }

  body.outerHTML = html;
}

function showError(msg) {
  var body = document.getElementById('cardBody');
  if (body) body.innerHTML =
    '<div class="error-msg">⚠️ Could not load status<br><small>' + msg + '</small><br><br>' +
    '<button onclick="loadStatus()" style="margin-top:8px;padding:8px 18px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px">Retry</button></div>';
}

function loadStatus() {
  callGas('getRoomStatus', [gasRoomName], renderStatus, showError);
}

loadStatus();
setInterval(loadStatus, 60000);
</script>
</body>
</html>
