<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --navy:#1e2d5c; --gold:#c9a961; --busy:#b91c1c; --free:#166534; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #0b0f17; color: #fff; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; padding: 2.2vh 3vw; gap: 2vh; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #1e2a3a; padding-bottom: 1.6vh; }
    .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .logo { height: 7vh; min-height: 44px; aspect-ratio: 1.5; background: #fff; border-radius: 10px; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .room { font-size: clamp(22px, 4vh, 40px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { color: #94a3b8; font-size: clamp(12px, 1.8vh, 17px); }
    .clock { text-align: right; } .clock .t { font-size: clamp(24px, 5vh, 52px); font-weight: 700; font-variant-numeric: tabular-nums; }
    .live { display: inline-flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
    .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: p 2s infinite; }
    .live.off::before { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
    @keyframes p { 50% { opacity: .35; } }
    .status { border-radius: 28px; padding: 4vh 3vw; text-align: center; transition: background .4s; box-shadow: inset 0 2px 10px rgba(0,0,0,.35); }
    .status.busy { background: var(--busy); } .status.free { background: var(--free); }
    .label { font-size: clamp(40px, 11vh, 120px); font-weight: 800; text-transform: uppercase; line-height: 1.05; letter-spacing: 2px; }
    .mtitle { font-size: clamp(20px, 4vh, 40px); font-weight: 600; margin-top: 1vh; word-break: break-word; }
    .host { font-size: clamp(15px, 2.6vh, 26px); opacity: .9; }
    .count { display: inline-block; margin-top: 1.6vh; background: rgba(0,0,0,.22); padding: .8vh 2vw; border-radius: 99px; font-size: clamp(16px, 2.8vh, 28px); font-weight: 600; }
    .bar { margin-top: 2vh; height: 14px; background: rgba(0,0,0,.3); border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #f59e0b); transition: width .5s; }
    .barlbl { display: flex; justify-content: space-between; font-size: 13px; color: #e2e8f0; margin-top: 6px; }
    .up { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .up h2 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #94a3b8; margin: 0 0 1vh; border-bottom: 1px solid #2d3748; padding-bottom: 8px; }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1vh; overflow-y: auto; }
    li { background: #1a2332; border-radius: 18px; padding: 1.4vh 18px; border-left: 5px solid var(--gold); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    li .tm { font-weight: 700; color: #e2e8f0; font-size: clamp(15px, 2.2vh, 22px); font-variant-numeric: tabular-nums; }
    li .nm { color: #94a3b8; font-size: clamp(13px, 1.9vh, 19px); }
    li.past { opacity: .45; border-left-color: #475569; }
    .none { color: #64748b; font-style: italic; text-align: center; padding: 2vh 0; }
    .foot { text-align: center; font-size: 12px; color: #475569; border-top: 1px solid #1e293b; padding-top: 1vh; }
    .err { color: #fca5a5; text-align: center; font-size: 20px; margin-top: 10vh; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <span class="logo"><img src="logo.png" alt="Kuwait Hospital logo"></span>
      <div style="min-width:0"><div class="room" id="room"></div><div class="sub" id="sub">Loading…</div></div>
    </div>
    <div class="clock"><div class="t" id="clock">--:--</div><span class="live" id="live">Live</span></div>
  </div>

  <section class="status free" id="status" aria-live="polite">
    <div class="label" id="label">Available</div>
    <div class="mtitle" id="mtitle"></div>
    <div class="host" id="host"></div>
    <div class="count" id="count" hidden></div>
    <div id="barBox" hidden><div class="bar"><div class="fill" id="fill"></div></div>
      <div class="barlbl"><span id="bStart"></span><span id="bEnd"></span></div></div>
  </section>

  <section class="up"><h2>Today's schedule</h2><ul id="list"><li class="none" style="border:0;background:none">Loading…</li></ul></section>
  <div class="foot">Kuwait Hospital · Meeting Room Booking · updates every minute</div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const $ = id => document.getElementById(id), ROOM = (new URLSearchParams(location.search).get('room') || '').trim();
  $('room').textContent = ROOM || 'No room chosen';
  if (!ROOM) document.getElementById('sub').textContent = 'Add ?room=Room%20Name to the address';
  const pad = n => String(n).padStart(2, '0');
  let S = null, skew = 0;                      // server time minus this device's time
  const now = () => Date.now() + skew;
  const hm = ms => { const d = new Date(ms + 3 * 3600e3); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };   // Kuwait time
  const dur = ms => { const m = Math.max(0, Math.ceil(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; };

  function paint() {
    $('clock').textContent = hm(now());
    if (!S) return;
    const t = now(), cur = S.meetings.find(m => t >= m.startMs && t < m.endMs), next = S.meetings.find(m => m.startMs > t);
    const st = $('status');
    if (cur) {
      st.className = 'status busy'; $('label').textContent = 'Occupied';
      $('mtitle').textContent = cur.title; $('host').textContent = [cur.host, cur.dept].filter(Boolean).join(' · ');
      $('count').hidden = false; $('count').textContent = 'Ends in ' + dur(cur.endMs - t) + '  ·  until ' + cur.end;
      $('barBox').hidden = false; $('fill').style.width = Math.min(100, (t - cur.startMs) / (cur.endMs - cur.startMs) * 100) + '%';
      $('bStart').textContent = cur.start; $('bEnd').textContent = cur.end;
    } else {
      st.className = 'status free'; $('label').textContent = 'Available';
      $('mtitle').textContent = next ? 'Next: ' + next.title : 'No more meetings today'; $('host').textContent = next ? next.start + ' – ' + next.end : '';
      $('count').hidden = !next; if (next) $('count').textContent = 'Free for ' + dur(next.startMs - t);
      $('barBox').hidden = true;
    }
    [...$('list').children].forEach(li => li.classList.toggle('past', Number(li.dataset.end) <= t));
  }
  function show(s) {
    S = s; skew = s.now - Date.now();
    $('room').textContent = s.room;
    $('sub').textContent = s.today + (s.capacity ? ' · up to ' + s.capacity + ' people' : '') + (s.location ? ' · ' + s.location : '');
    const ul = $('list'); ul.innerHTML = '';
    if (!s.meetings.length) { const li = document.createElement('li'); li.className = 'none'; li.style.cssText = 'border:0;background:none';
                              li.textContent = 'No meetings booked today'; ul.append(li); }
    s.meetings.forEach(m => {
      const li = document.createElement('li'); li.dataset.end = m.endMs;
      const a = document.createElement('div'), tm = document.createElement('div'), nm = document.createElement('div');
      tm.className = 'tm'; tm.textContent = m.start + ' – ' + m.end; nm.className = 'nm'; nm.textContent = m.title + (m.host ? ' · ' + m.host : '');
      a.append(tm, nm); li.append(a); ul.append(li);
    });
    $('live').className = 'live'; $('live').textContent = 'Live';
    paint();
  }
  function load() {
    google.script.run.withSuccessHandler(show)
      .withFailureHandler(e => { $('live').className = 'live off'; $('live').textContent = 'Reconnecting';
        if (!S) $('sub').textContent = String((e && e.message) || e).replace(/^(Error|Exception):\s*/, ''); })
      .getRoomStatus(ROOM);
  }
  load(); setInterval(load, 60000); setInterval(paint, 1000);
  setTimeout(() => location.reload(), 6 * 3600e3);   // fresh page every 6 hours on always-on tablets
</script>
</body>
</html>
