<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Status – Kuwait Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root{--navy:#0b1a3d;--gold:#c9a961;--free:#166634;--busy:#b91c1c;--muted:#94a3b8;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;overflow:hidden;}
    body{background:#0b1a3d;color:#fff;font-family:'Fira Sans','Segoe UI',system-ui,sans-serif;}

    /* ══ MATRIX CANVAS (always on) ══ */
    #bgCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
    #bgVignette{position:fixed;inset:0;pointer-events:none;z-index:1;
      background:radial-gradient(ellipse 60% 60% at 50% 50%,rgba(11,26,61,.62) 0%,rgba(11,26,61,.08) 65%,rgba(11,26,61,.55) 100%);}

    /* corner brackets */
    .crn{position:fixed;z-index:3;width:22px;height:22px;border-color:rgba(100,160,255,.35);border-style:solid;}
    .tl{top:16px;left:16px; border-width:2px 0 0 2px;}
    .tr{top:16px;right:16px; border-width:2px 2px 0 0;}
    .bl{bottom:16px;left:16px; border-width:0 0 2px 2px;}
    .br{bottom:16px;right:16px; border-width:0 2px 2px 0;}

    /* ══ SELECT SCREEN ══ */
    #selectScreen{
      position:fixed;inset:0;z-index:2;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:0;
    }

    /* floating logo */
    .sel-logo-wrap{
      position:relative;
      width:clamp(110px,18vmin,200px);height:clamp(110px,18vmin,200px);
      display:flex;align-items:center;justify-content:center;
      margin-bottom:clamp(10px,1.8vh,22px);
    }
    .sel-logo-sq{
      width:88%;height:88%;background:#fff;
      border-radius:clamp(14px,2.8vmin,26px);
      display:flex;align-items:center;justify-content:center;overflow:hidden;
      box-shadow:0 0 40px rgba(100,160,255,.35);
      animation:float 4s ease-in-out infinite;
    }
    .sel-logo-wrap::after{
      content:'';position:absolute;left:50%;
      bottom:calc(-1*clamp(8px,1.8vmin,18px));
      width:60%;height:clamp(6px,1.2vmin,12px);
      margin-left:-30%;border-radius:50%;
      background:rgba(100,160,255,.55);
      filter:blur(clamp(4px,.8vmin,9px));
      animation:float-shadow 4s ease-in-out infinite;
    }
    @keyframes float{0%,100%{transform:translateY(-10px);}50%{transform:translateY(10px);}}
    @keyframes float-shadow{0%,100%{transform:scaleX(.7);opacity:.22;}50%{transform:scaleX(1);opacity:.5;}}
    .sel-logo-sq img{width:84%;height:84%;object-fit:contain;}

    /* title */
    .sel-title{
      font-size:clamp(28px,min(7.5vmin,5.5vw),96px);
      font-weight:600;letter-spacing:.12em;
      text-shadow:0 0 30px rgba(100,160,255,.6);
      color:#c8e0ff;line-height:1;
      margin-bottom:clamp(4px,.7vh,10px);
    }
    .sel-sub{
      font-size:clamp(10px,2vmin,20px);
      letter-spacing:.35em;color:#c8e0ff;opacity:.72;
      margin-bottom:clamp(6px,1vh,14px);
    }
    .sel-divider{
      width:clamp(180px,40vmin,440px);height:1px;
      background:linear-gradient(90deg,transparent,rgba(200,224,255,.5),transparent);
      margin-bottom:clamp(10px,1.6vh,20px);
    }

    /* clock */
    .sel-clk{
      font-size:clamp(22px,5vmin,62px);font-weight:200;
      letter-spacing:.1em;font-family:monospace;
      font-variant-numeric:tabular-nums;
      color:#c8e0ff;text-shadow:0 0 28px rgba(100,160,255,.5);
      line-height:1;margin-bottom:clamp(3px,.5vh,8px);
    }
    .sel-dt{
      font-size:clamp(10px,2.2vmin,22px);font-weight:300;
      letter-spacing:.2em;font-family:monospace;
      color:#c8e0ff;text-shadow:0 0 18px rgba(100,160,255,.4);
      opacity:.8;margin-bottom:clamp(12px,2vh,28px);
    }

    /* ── ROOM BUTTONS ── */
    .rooms-btns{display:flex;flex-direction:column;gap:clamp(7px,1.1vh,13px);width:clamp(240px,55vw,560px);}

    .room-btn{
      position:relative;overflow:hidden;cursor:pointer;
      border:1px solid rgba(100,160,255,.22);
      border-radius:12px;
      padding:clamp(10px,1.5vh,18px) clamp(16px,2vw,28px);
      background:rgba(255,255,255,.04);
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      transition:background .2s,border-color .2s,transform .15s,box-shadow .2s;
      /* stagger entrance */
      opacity:0;animation:btn-in .5s ease forwards;
    }
    .room-btn:nth-child(1){animation-delay:.05s;}
    .room-btn:nth-child(2){animation-delay:.15s;}
    .room-btn:nth-child(3){animation-delay:.25s;}
    .room-btn:nth-child(4){animation-delay:.35s;}
    @keyframes btn-in{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

    /* left gold bar */
    .room-btn::before{
      content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
      background:var(--gold);border-radius:4px 0 0 4px;
      transition:width .18s;
    }
    /* shimmer sweep on hover */
    .room-btn::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);
      transform:translateX(-100%);transition:transform .4s ease;
    }
    .room-btn:hover::after{transform:translateX(100%);}
    .room-btn:hover{background:rgba(100,160,255,.1);border-color:rgba(100,160,255,.45);transform:translateX(5px);box-shadow:0 0 18px rgba(100,160,255,.12);}
    .room-btn:hover::before{width:6px;}

    .rb-dot{width:clamp(9px,1.3vh,13px);height:clamp(9px,1.3vh,13px);border-radius:50%;background:#475569;flex-shrink:0;transition:background .4s,box-shadow .4s;}
    .rb-dot.free{background:#22c55e;box-shadow:0 0 9px #22c55e;animation:pulse 2s infinite;}
    .rb-dot.busy{background:#ef4444;box-shadow:0 0 9px #ef4444;animation:pulse 2s infinite;}
    @keyframes pulse{50%{opacity:.3;}}

    .rb-info{flex:1;min-width:0;text-align:left;}
    .rb-name{font-size:clamp(13px,2vh,19px);font-weight:600;color:#e2e8f0;letter-spacing:.02em;line-height:1.2;}
    .rb-loc{font-size:clamp(10px,1.35vh,13px);color:var(--muted);margin-top:2px;letter-spacing:.03em;}

    .rb-arrow{font-size:clamp(14px,2vh,22px);color:rgba(100,160,255,.3);flex-shrink:0;transition:color .18s,transform .18s;}
    .room-btn:hover .rb-arrow{color:var(--gold);transform:translateX(4px);}

    /* ══ ROOM DISPLAY SCREEN ══ */
    #displayScreen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;background:rgba(11,26,61,.92);}
    #displayScreen.show{display:flex;}

    .back-bar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 20px;background:rgba(11,26,61,.85);backdrop-filter:blur(6px);border-bottom:1px solid rgba(100,160,255,.12);cursor:pointer;user-select:none;}
    .back-bar:hover{background:rgba(100,160,255,.08);}
    .back-arrow-btn{font-size:18px;color:var(--gold);}
    .back-txt{font-size:13px;color:var(--muted);}
    .back-room{font-size:13px;font-weight:600;color:#e2e8f0;margin-left:4px;}

    .disp-wrap{flex:1;display:flex;flex-direction:column;padding:2vh 3vw;gap:2vh;overflow:hidden;}
    .disp-top{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #1e2a3a;padding-bottom:1.6vh;}
    .disp-room{font-size:clamp(20px,4vh,36px);font-weight:700;}
    .disp-sub{color:var(--muted);font-size:clamp(12px,1.8vh,16px);}
    .disp-clock{text-align:right;}
    .disp-clock .t{font-size:clamp(22px,4.5vh,48px);font-weight:300;font-variant-numeric:tabular-nums;}
    .live-dot{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;}
    .live-dot::before{content:'';width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 2s infinite;}
    .live-dot.off::before{background:#f59e0b;box-shadow:0 0 8px #f59e0b;}

    .disp-status{flex-shrink:0;border-radius:20px;padding:3vh 2.5vw;text-align:center;transition:background .4s;box-shadow:inset 0 2px 10px rgba(0,0,0,.35);}
    .disp-status.free{background:var(--free);}
    .disp-status.busy{background:var(--busy);}
    .disp-label{font-size:clamp(36px,10vh,100px);font-weight:800;text-transform:uppercase;line-height:1.05;letter-spacing:2px;}
    .disp-mtitle{font-size:clamp(16px,3vh,32px);font-weight:600;margin-top:.8vh;}
    .disp-host{font-size:clamp(13px,2.2vh,20px);opacity:.9;}
    .disp-count{display:inline-block;margin-top:1.2vh;background:rgba(0,0,0,.22);padding:.6vh 2vw;border-radius:99px;font-size:clamp(13px,2.2vh,22px);font-weight:600;}
    .disp-bar{margin-top:1.4vh;height:10px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden;}
    .disp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f59e0b);transition:width .5s;}
    .disp-barlbl{display:flex;justify-content:space-between;font-size:11px;color:#e2e8f0;margin-top:3px;}

    .disp-sched{flex:1;display:flex;flex-direction:column;min-height:0;}
    .disp-sched h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 1vh;border-bottom:1px solid #2d3748;padding-bottom:7px;flex-shrink:0;}
    .sched-list{list-style:none;display:flex;flex-direction:column;gap:1vh;overflow-y:auto;}
    .sched-list li{background:#1a2332;border-radius:12px;padding:1vh 14px;border-left:4px solid var(--gold);display:flex;justify-content:space-between;gap:12px;align-items:center;}
    .sched-list li .tm{font-weight:700;color:#e2e8f0;font-size:clamp(13px,1.8vh,19px);font-variant-numeric:tabular-nums;}
    .sched-list li .nm{color:var(--muted);font-size:clamp(11px,1.6vh,16px);}
    .sched-list li.past{opacity:.4;border-left-color:#475569;}
    .sched-list li.active-slot{border-left-color:#ef4444;background:#1f1515;}
    .sched-none{color:#64748b;font-style:italic;text-align:center;padding:2vh 0;}
    .disp-foot{flex-shrink:0;text-align:center;font-size:10px;color:#475569;border-top:1px solid #1e293b;padding-top:.8vh;}

    /* ══ SCREENSAVER ══ */
    #screensaver{display:none;position:fixed;inset:0;z-index:9999;background:#0b1a3d;align-items:center;justify-content:center;cursor:pointer;}
    #screensaver.active{display:flex;}
    .ss-crn{position:absolute;z-index:6;width:20px;height:20px;border-color:rgba(100,160,255,.4);border-style:solid;}
    .ss-tl{top:16px;left:16px;border-width:2px 0 0 2px;}
    .ss-tr{top:16px;right:16px;border-width:2px 2px 0 0;}
    .ss-bl{bottom:16px;left:16px;border-width:0 0 2px 2px;}
    .ss-br{bottom:16px;right:16px;border-width:0 2px 2px 0;}
    .ss-hint{position:absolute;bottom:clamp(16px,3vmin,32px);color:rgba(100,160,255,.4);font-size:clamp(11px,1.8vmin,16px);letter-spacing:1.5px;z-index:7;}
    #ss-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.7;pointer-events:none;}
    #ss-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 55% 55% at 50% 48%,rgba(11,26,61,.55) 0%,rgba(11,26,61,.12) 70%,rgba(11,26,61,.48) 100%);}
    #ss-center{display:flex;flex-direction:column;align-items:center;position:relative;z-index:5;}
    .ss-logo-wrap{position:relative;width:clamp(140px,26vmin,300px);height:clamp(140px,26vmin,300px);display:flex;align-items:center;justify-content:center;}
    .ss-logo-sq{width:90%;height:90%;background:#fff;border-radius:clamp(14px,3vmin,26px);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 40px rgba(100,160,255,.35);animation:float 4s ease-in-out infinite;}
    .ss-logo-wrap::after{content:'';position:absolute;left:50%;bottom:calc(-1*clamp(8px,2vmin,20px));width:60%;height:clamp(7px,1.5vmin,14px);margin-left:-30%;border-radius:50%;background:rgba(100,160,255,.6);filter:blur(clamp(4px,1vmin,10px));animation:float-shadow 4s ease-in-out infinite;}
    .ss-logo-sq img{width:86%;height:86%;object-fit:contain;background:#fff;}
    .ss-name{color:#c8e0ff;font-size:clamp(28px,min(8vmin,5.5vw),100px);font-weight:600;letter-spacing:.12em;line-height:1.1;margin-top:clamp(16px,3vmin,36px);text-align:center;text-shadow:0 0 30px rgba(100,160,255,.6);}
    .ss-sub{color:#c8e0ff;font-size:clamp(11px,2.2vmin,24px);letter-spacing:.35em;margin-top:clamp(4px,1vmin,10px);text-align:center;opacity:.75;}
    .ss-div{width:clamp(200px,42vmin,480px);height:1px;background:linear-gradient(90deg,transparent,rgba(200,224,255,.5),transparent);margin:clamp(12px,2.2vmin,26px) auto 0;}
    .ss-clk{color:#c8e0ff;font-size:clamp(28px,6vmin,72px);font-weight:200;letter-spacing:.1em;font-family:monospace;font-variant-numeric:tabular-nums;margin-top:clamp(10px,1.8vmin,22px);text-align:center;text-shadow:0 0 30px rgba(100,160,255,.5);}
    .ss-dt{color:#c8e0ff;font-size:clamp(12px,2.4vmin,26px);font-weight:300;letter-spacing:.2em;font-family:monospace;margin-top:clamp(5px,1vmin,12px);text-align:center;text-shadow:0 0 20px rgba(100,160,255,.4);}
  </style>
</head>

  <div class="sel-sub">MEETING ROOM BOOKING</div>
  <div class="sel-divider"></div>

  <!-- Clock -->
  <div class="sel-clk" id="selClock">--:--:--</div>
  <div class="sel-dt"  id="selDate">---</div>

  <!-- Room buttons -->
  <div class="rooms-btns" id="roomsBtns"></div>

</div>

<!-- ═══ ROOM DISPLAY ═══ -->
<div id="displayScreen">
  <div class="back-bar" id="backBtn">
    <span class="back-arrow-btn">&#8592;</span>
    <span class="back-txt">All rooms</span>
    <span class="back-room" id="backRoomName"></span>
  </div>
  <div class="disp-wrap">
    <div class="disp-top">
      <div>
        <div class="disp-room" id="dispRoom">—</div>
        <div class="disp-sub"  id="dispSub"></div>
      </div>
      <div class="disp-clock">
        <div class="t" id="dispClock">--:--</div>
        <span class="live-dot" id="dispLive">Live</span>
      </div>
    </div>
    <section class="disp-status free" id="dispStatus">
      <div class="disp-label"  id="dispLabel">Available</div>
      <div class="disp-mtitle" id="dispMtitle"></div>
      <div class="disp-host"   id="dispHost"></div>
      <div class="disp-count"  id="dispCount" hidden></div>
      <div id="dispBarBox" hidden>
        <div class="disp-bar"><div class="disp-fill" id="dispFill"></div></div>
        <div class="disp-barlbl"><span id="dispBStart"></span><span id="dispBEnd"></span></div>
      </div>
    </section>
    <section class="disp-sched">
      <h2>Today's schedule</h2>
      <ul class="sched-list" id="schedList">
        <li style="border:0;background:none"><span class="sched-none">Loading…</span></li>
      </ul>
    </section>
    <div class="disp-foot">Kuwait Hospital · updates every 60 s</div>
  </div>
</div>

<script>
var GAS_URL='https://script.google.com/macros/s/AKfycbwM9MzgGc_8xWvrqgB80MDjIGNCyrbj15OHZBYXPY1bEpLURpBDZOrqdfV-j-RESyBg/exec';
var ROOMS=[
  {name:'Executive Room',        location:'Floor 10',       capacity:10},
  {name:'KHC Meeting Hall',      location:'Floor 1',        capacity:40},
  {name:'Basement Meeting Room', location:'Basement Floor', capacity:15},
  {name:'Hall 1015',             location:'Floor 10',       capacity:15}
];
var $=function(id){return document.getElementById(id);};
var pad=function(n){return String(n).padStart(2,'0');};
var skew=0,ACTIVE_ROOM=null,S=null,pollTimer=null,ssActive=false,manualExitUntil=0;
function nowMs(){return Date.now()+skew;}
function kuwaitNow(){var n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+3*3600000);}
function durStr(ms){var m=Math.max(0,Math.ceil(ms/60000));return m>=60?Math.floor(m/60)+' h '+(m%60?m%60+' min':''):m+' min';}

/* ── CLOCK ── */
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
var SMON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function tickClock(){
  var k=kuwaitNow();
  var ts=pad(k.getHours())+':'+pad(k.getMinutes())+':'+pad(k.getSeconds());
  var ds=DAYS[k.getDay()].substring(0,3).toUpperCase()+' '+pad(k.getDate())+' '+SMON[k.getMonth()]+' '+k.getFullYear();
  $('selClock').textContent=ts; $('selDate').textContent=ds;
  $('ss-clk').textContent=ts; $('ss-dt').textContent=ds;
  if(ACTIVE_ROOM) $('dispClock').textContent=pad(k.getHours())+':'+pad(k.getMinutes());
}
setInterval(tickClock,1000); tickClock();

/* ── BACKGROUND MATRIX ── */
(function(){
  var cv=$('bgCanvas'),ctx=cv.getContext('2d'),cols,drops;
  function resize(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16)+1;drops=Array(cols).fill(1);}
  resize(); window.addEventListener('resize',resize);
  var chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01';
  (function frame(){
    ctx.fillStyle='rgba(11,26,61,0.055)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='rgba(100,160,255,0.4)';ctx.font='13px monospace';
    for(var i=0;i<drops.length;i++){
      if(Math.random()<0.35){
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,drops[i]*16);
        if(drops[i]*16>cv.height&&Math.random()>.975)drops[i]=0;
        drops[i]++;
      }
    }
    requestAnimationFrame(frame);
  })();
})();

/* ── SCREENSAVER MATRIX ── */
var ssMatRunning=false;
function startSsMat(){
  if(ssMatRunning)return;ssMatRunning=true;
  var cv=$('ss-canvas'),ctx=cv.getContext('2d'),cols,drops;
  function resize(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16)+1;drops=Array(cols).fill(1);}
  resize(); window.addEventListener('resize',resize);
  var chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01';
  (function frame(){
    if(!$('screensaver').classList.contains('active')){ssMatRunning=false;return;}
    ctx.fillStyle='rgba(11,26,61,0.05)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='rgba(100,160,255,0.55)';ctx.font='14px monospace';
    for(var i=0;i<drops.length;i++){
      if(Math.random()<0.35){
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,drops[i]*16);
        if(drops[i]*16>cv.height&&Math.random()>.975)drops[i]=0;
        drops[i]++;
      }
    }
    requestAnimationFrame(frame);
  })();
}

/* ── ROOM BUTTONS ── */
var roomStatus={};
function buildBtns(){
  var wrap=$('roomsBtns');wrap.innerHTML='';
  ROOMS.forEach(function(r,idx){
    var id='rs-'+r.name.replace(/\W/g,'_');
    var st=roomStatus[r.name]||'';
    var btn=document.createElement('div');
    btn.className='room-btn';
    btn.style.animationDelay=(idx*0.1+0.05)+'s';
    btn.innerHTML=
      '<div class="rb-dot '+st+'" id="'+id+'"></div>'+
      '<div class="rb-info">'+
        '<div class="rb-name">'+r.name+'</div>'+
        '<div class="rb-loc">'+r.location+'</div>'+
      '</div>'+
      '<div class="rb-arrow">&#8250;</div>';
    btn.addEventListener('click',function(){window.location.href='https://mdsirajudeen.github.io/meetingroom.booking/room.html?room='+encodeURIComponent(r.name);});
    wrap.appendChild(btn);
  });
}
buildBtns();

/* ── POLL ALL ROOMS ── */
function pollAllRooms(){
  ROOMS.forEach(function(r){
    fetch(GAS_URL,{method:'POST',body:JSON.stringify({fn:'getRoomStatus',args:[r.name]})})
      .then(function(res){return res.json();})
      .then(function(d){
        if(!d.ok)return;
        var t=Date.now()+(d.data.now-Date.now());
        var busy=d.data.meetings&&d.data.meetings.some(function(m){return t>=m.startMs&&t<m.endMs;});
        roomStatus[r.name]=busy?'busy':'free';
        var dot=$('rs-'+r.name.replace(/\W/g,'_'));
        if(dot)dot.className='rb-dot '+(busy?'busy':'free');
      }).catch(function(){});
  });
}
pollAllRooms(); setInterval(pollAllRooms,60000);

/* ── URL ── */
function setUrl(room){var u=new URL(location.href);room?u.searchParams.set('room',room):u.searchParams.delete('room');history.replaceState(null,'',u.toString());}

/* ── NAVIGATION ── */
function openRoom(name){
  ACTIVE_ROOM=name;S=null;setUrl(name);
  $('selectScreen').style.display='none';
  $('displayScreen').classList.add('show');
  $('backRoomName').textContent=name;
  $('dispRoom').textContent=name;$('dispSub').textContent='';
  $('dispLabel').textContent='Loading…';$('dispMtitle').textContent='';$('dispHost').textContent='';
  $('schedList').innerHTML='<li style="border:0;background:none"><span class="sched-none">Loading…</span></li>';
  loadRoom();
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(loadRoom,60000);
  ssActive=false;$('screensaver').classList.remove('active');
}
function goBack(){
  ACTIVE_ROOM=null;S=null;
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  setUrl(null);
  $('displayScreen').classList.remove('show');
  $('selectScreen').style.display='';
  ssActive=false;$('screensaver').classList.remove('active');
  buildBtns();
}
$('backBtn').addEventListener('click',goBack);

/* ── LOAD / RENDER ROOM ── */
function loadRoom(){
  if(!ACTIVE_ROOM)return;
  fetch(GAS_URL,{method:'POST',body:JSON.stringify({fn:'getRoomStatus',args:[ACTIVE_ROOM]})})
    .then(function(r){return r.json();})
    .then(function(d){d.ok?showRoom(d.data):($('dispLive').className='live-dot off',$('dispLive').textContent='Error');})
    .catch(function(){$('dispLive').className='live-dot off';$('dispLive').textContent='Reconnecting';});
}
function showRoom(s){
  S=s;skew=s.now-Date.now();
  var info=ROOMS.find(function(r){return r.name===ACTIVE_ROOM;})||{};
  $('dispSub').textContent=[s.today,info.location||''].filter(Boolean).join('  ·  ');
  $('dispLive').className='live-dot';$('dispLive').textContent='Live';
  var ul=$('schedList');ul.innerHTML='';
  if(!s.meetings||!s.meetings.length){
    var li=document.createElement('li');li.style.cssText='border:0;background:none';
    li.innerHTML='<span class="sched-none">No meetings booked today</span>';ul.appendChild(li);
  } else {
    s.meetings.forEach(function(m){
      var li=document.createElement('li');li.dataset.end=m.endMs;li.dataset.start=m.startMs;
      li.innerHTML='<div class="tm">'+m.start+' – '+m.end+'</div>'+
        '<div class="nm">'+(m.priv?'Private meeting':m.title+(m.host?'  ·  '+m.host:''))+'</div>';
      ul.appendChild(li);
    });
  }
  paintRoom();evaluateSS();
}
function paintRoom(){
  if(!ACTIVE_ROOM)return;
  var k=kuwaitNow();$('dispClock').textContent=pad(k.getHours())+':'+pad(k.getMinutes());
  if(!S)return;
  var t=nowMs(),cur=null,next=null;
  S.meetings.forEach(function(m){if(t>=m.startMs&&t<m.endMs)cur=m;});
  S.meetings.forEach(function(m){if(m.startMs>t&&(!next||m.startMs<next.startMs))next=m;});
  var st=$('dispStatus');
  if(cur){
    st.className='disp-status busy';
    $('dispLabel').textContent='Occupied';
    $('dispMtitle').textContent=cur.priv?'Private meeting':cur.title;
    $('dispHost').textContent=cur.priv?'':[cur.host,cur.dept].filter(Boolean).join(' · ');
    $('dispCount').hidden=false;$('dispCount').textContent='Ends in '+durStr(cur.endMs-t)+'  ·  until '+cur.end;
    $('dispBarBox').hidden=false;
    $('dispFill').style.width=Math.min(100,(t-cur.startMs)/(cur.endMs-cur.startMs)*100)+'%';
    $('dispBStart').textContent=cur.start;$('dispBEnd').textContent=cur.end;
  } else {
    st.className='disp-status free';
    $('dispLabel').textContent='Available';
    $('dispMtitle').textContent=next?'Next: '+(next.priv?'Private meeting':next.title):'No more meetings today';
    $('dispHost').textContent=next?next.start+' – '+next.end:'';
    $('dispCount').hidden=!next;if(next)$('dispCount').textContent='Free for '+durStr(next.startMs-t);
    $('dispBarBox').hidden=true;
  }
  var items=$('schedList').children;
  for(var i=0;i<items.length;i++){
    var e=Number(items[i].dataset.end),s2=Number(items[i].dataset.start);
    items[i].classList.toggle('past',e<=t);items[i].classList.toggle('active-slot',s2<=t&&t<e);
  }
}
setInterval(paintRoom,10000);

/* ── SCREENSAVER ── */
function shouldSS(){
  if(!S||!ACTIVE_ROOM)return false;var t=nowMs();if(t<manualExitUntil)return false;
  if(S.meetings.some(function(m){return t>=m.startMs&&t<m.endMs;}))return false;
  if(S.meetings.some(function(m){return m.startMs>t&&(m.startMs-t)<=3600000;}))return false;
  if(!S.meetings.length)return true;
  var fut=S.meetings.filter(function(m){return m.endMs>t;});
  if(!fut.length){var last=Math.max.apply(null,S.meetings.map(function(m){return m.endMs;}));return t>=last+30*60000;}
  return true;
}
function evaluateSS(){shouldSS()?enterSS():exitSS();}
function enterSS(){if(!ssActive){ssActive=true;$('screensaver').classList.add('active');startSsMat();}}
function exitSS(){if(ssActive){ssActive=false;$('screensaver').classList.remove('active');}}
$('screensaver').addEventListener('click',function(){manualExitUntil=Date.now()+5*60000;exitSS();});
setInterval(evaluateSS,30000);

/* ── AUTO-OPEN FROM URL ── */
(function(){
  var r=decodeURIComponent(new URLSearchParams(location.search).get('room')||'');
  if(r&&ROOMS.some(function(x){return x.name===r;}))openRoom(r);
})();
</script>
</body>
</html>
